[project]
name = "phaicull"
version = "0.1.0"
description = "AI-powered photo culling tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "pillow-heif>=0.18.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0",
]

[project.scripts]
phaicull = "core.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "PTH", # use pathlib (per AGENTS.md: pathlib only, never os.path)
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core"]

[[tool.mypy.overrides]]
module = ["pillow_heif", "cv2"]
ignore_missing_imports = true
